<div class="orders-menu">

    <section class="cards mb-4">
        <div class="row g-4">

            <div class="col-lg-3 col-md-6" *ngFor="let card of summaryCards">

                <app-card [card]="card">
                </app-card>

            </div>

        </div>
    </section>

    <!-- ALL ORDERS TABLE -->
    <section class="orders-table-wrapper mb-4">
        <app-table title="All Orders" subtitle="Manage and track all store orders" [columns]="orderColumns"
            [data]="orderData" [showSearch]="true" [showFilter]="true" [showExport]="true" [showPagination]="true"
            [filterOptions]="['All','Delivered','Pending','Cancelled']" exportText="Export CSV" [actions]="actions">

        </app-table>
    </section>

</div>
